<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab16 - Form Validation</title>
    <style>
        .valid {
            color: green;
        }

        .invalid {
            color: red;
        }
    </style>
</head>
<body>
    <form action="#">
        <label for="name">Name: </label>
        <input type="text" id="name" required><br>
        <label for="email">Email: </label>
        <input type="email" id="email" required><br>
        <label for="password">Password: </label>
        <input type="password" id="password" required autocomplete><br>
        <div class="rules" id="password-rules" hidden>
            <div id="rule-length" class="rule">At least 6 characters</div>
            <div id="rule-special" class="rule">Must include a special character (!@#$...)</div>
            <div id="rule-uppercase" class="rule">Must include an uppercase letter (A-Z)</div>
        </div>
        <button type="submit">Submit</button>
        <p id="output"></p>
        <script>
            const name = document.getElementById("name");
            const email = document.getElementById("email");
            const password = document.getElementById("password");
            const output = document.getElementById("output");
            const passwordRules = document.getElementById("password-rules");
            const lengthRule = document.getElementById("rule-length");
            const specialRule = document.getElementById("rule-special");
            const uppercaseRule = document.getElementById("rule-uppercase");

            document.addEventListener("submit", (event)=>{
                event.preventDefault();
                output.textContent = "Submitted";
            });
            password.addEventListener("input", () => {
                const value = password.value;
                passwordRules.hidden = false;
                lengthRule.classList.toggle("valid", value.length >= 6);
                lengthRule.classList.toggle("invalid", value.length < 6);
                specialRule.classList.toggle("valid", /[!@#$%^&*(),.?":{}|<>]/.test(value));
                specialRule.classList.toggle("invalid", !/[!@#$%^&*(),.?":{}|<>]/.test(value));
                uppercaseRule.classList.toggle("valid", /[A-Z]/.test(value));
                uppercaseRule.classList.toggle("invalid", !/[A-Z]/.test(value));
            });

        </script>
    </form>
</body>
</html>
