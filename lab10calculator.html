<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 10 - Calculator</title>
</head>
<body>
    <script>
        let number = 0;
        let input;
        input = prompt("What is the total restaurant bill amount?");
        do {
            if (input < 0) {
                input = prompt("Negative amounts are not allowed. Please enter a valid bill amount.");
            }
            if (input == 0 || input == null) {
                input = prompt("Please enter a bill amount greater than zero.");
            }
            if (isNaN(input)) {
                input = prompt("Invalid input. Please enter a numeric bill amount.");
            }
        } while (input <= 0 || isNaN(input));
        number = input;
        let tip = number * 0.1;
        console.log(typeof(input));
        console.log(`For a bill of $${number}, the tip should be $${tip}.`);
    </script>
</body>
</html>
