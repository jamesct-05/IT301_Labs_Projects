<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
    body {
        background-color: #f0f2f5;
        font-family: Helvetica, Arial, sans-serif;
    }

    form {
        min-height: 180px;
    }

    article, form {
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        padding: 12px 16px;
        margin-bottom: 16px;
        max-width: 680px;
        margin-left: auto;
        margin-right: auto;
    }

    h2 {
        color: #050505;
        font-size: 0.9375rem;
        font-weight: 600;
        margin: 0 0 4px 0;
    }

    p {
        color: #050505;
        font-size: 0.9375rem;
        line-height: 1.3333;
        margin: 8px 0 0 0;
    }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>

    <script>
        let posts = [];
        let userID = -1;
        let id = -1;
        const filterBtn = document.getElementById("filterBtn");
        const displayUserBtn = document.getElementById("displayUserBtn");
        const findBtn = document.getElementById("findBtn");

        async function fetchData(url) {
            const response = await fetch(url);
            posts = await response.json();
            console.table(posts);
            displayPosts(posts);
        }
        function displayPosts(postsToDisplay){
            const oldEmptyMessage = document.getElementById("emptyMessage");
            if (oldEmptyMessage) {
                oldEmptyMessage.remove();
            }

            document.querySelectorAll('article').forEach((article) => {
                article.remove();
            });
            postsToDisplay.forEach((item, index) => {
                if ((userID < 0 || userID === item.userId) && (id < 0 || id === item.id)){
                    const article = document.createElement("article");
                    const h2 = document.createElement("h2");
                    const p = document.createElement("p");

                    h2.textContent = item.title;
                    p.textContent = item.body;

                    article.appendChild(h2);
                    article.appendChild(p);
                    document.body.appendChild(article);
                }
            });
            if (document.querySelectorAll('article').length == 0){
                const emptyMessage = document.createElement("p");
                emptyMessage.textContent = "No Posts Found";
                emptyMessage.id = "emptyMessage";
                document.body.appendChild(emptyMessage);
            }
        }

        const apiURL = "https://jsonplaceholder.typicode.com/posts";
        fetchData(apiURL);

        filterBtn.addEventListener("click", (event) => {
            event.preventDefault();
            const selectedUserID = document.getElementById("userID").value;
            if (selectedUserID === "") {
                userID = -1;
            } else {
                userID = Number(selectedUserID);
            }
            displayPosts(posts);
        });
        displayUserBtn.addEventListener("click", (event) => {
            event.preventDefault();
            const inputtedUserID = document.getElementById("displayUserID").value;
            if (inputtedUserID === "") {
                userID = -1;
            } else {
                userID = Number(inputtedUserID);
            }
            displayPosts(posts);
        });
        findBtn.addEventListener("click", (event) => {
            event.preventDefault();
            const inputtedPostID = document.getElementById("postID").value;
            if (inputtedPostID === "") {
                id = -1;
            } else {
                id = Number(inputtedPostID);
            }
            displayPosts(posts);
        })

    </script>

</body>
</html>
